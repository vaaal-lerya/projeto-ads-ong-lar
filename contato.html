<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LAR - Contato</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <a href="index.html">
            <img src="IMG/logo.png" alt="Logo da ONG LAR">
        </a>

        <nav>
            <a href="index.html">Início</a>
            <a href="quem-somos.html">Quem Somos</a>
            <a href="projetos.html">Projetos</a>
            <a href="como-ajudar.html">Faça Parte</a>
            <a href="contato.html">Contato</a>
        </nav>

    </header>


    <main>

        <section class="contato-introducao">

            <h1>Entre em Contato</h1>

            <p>
                Quer saber mais sobre a LAR, nossos projetos ou as formas
                de participar? Envie uma mensagem.
            </p>

        </section>


        <section class="contato-formulario">

            <form>

                <div class="campo">

                    <label for="nome">Nome</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="assunto">Assunto</label>

                    <input
                        type="text"
                        id="assunto"
                        name="assunto"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="mensagem">Mensagem</label>

                    <textarea
                        id="mensagem"
                        name="mensagem"
                        rows="6"
                        required
                    ></textarea>

                </div>


                <button type="submit">
                    Enviar mensagem
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>LAR - Lugar de Apoio e Recomeço</p>

    </footer>

</body>

</html>
